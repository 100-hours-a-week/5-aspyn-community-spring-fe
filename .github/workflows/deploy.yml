name: Deploy Frontend to EC2

on:
  push:
    branches:
      - main # main 브랜치에 push될 때 실행

jobs:
  make-image-and-push:
    runs-on: ubuntu-latest

    steps:
      # 리포지토리 체크아웃
      - name: Checkout Repository
        uses: actions/checkout@v3

      # 깃허브 로그인 (GitHub Container Registry)
      - name: Login to GitHub Container Registry
        run: echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ secrets.GHCR_OWNER }} --password-stdin

      # 프론트 빌드
      - name: Prepare static files
        run: |
          # 바닐라 JS 프로젝트의 파일들을 build 디렉토리로 복사 (수동 준비)
          mkdir -p build
          cp -r public/* build/

      # Docker 이미지 빌드 & GHCR에 푸시
      - name: Build and Push Docker Image
        env:
          GHCR_REPO: ghcr.io/bysoyeon/chalcak-fe-container
        run: |
          docker build --build-arg API_URL=${{ secrets.API_URL }} \
                       -t $GHCR_REPO:latest .
          docker push $GHCR_REPO:latest

  pull-and-deploy:
    runs-on: [self-hosted, Linux, X64, chalcak-frontend]
    name: Deploy Frontend by Self-Hosted Runner
    needs: make-image-and-push # 앞의 job이 성공해야 실행됨

    steps:
      # 환경변수 파일 설정
      - name: Create .env File
        run: |
          echo "${{ secrets.ENV }}" > /home/ubuntu/chalcak/fe/.env

      - name: Login to GitHub Container Registry
        run: |
          echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ secrets.GHCR_OWNER }} --password-stdin

      - name: Pull and Deploy New Docker Image
        run: |
          cd /home/ubuntu/chalcak/fe

          # 최신 이미지 가져오기
          docker-compose pull

          # 기존 컨테이너 중지 및 삭제
          docker-compose down

          # 새 컨테이너 실행
          docker-compose up -d
